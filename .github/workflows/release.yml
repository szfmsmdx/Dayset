name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build app
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Stage portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/dayset.exe artifacts/Dayset_x64.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dayset-windows-x64
          if-no-files-found: error
          path: |
            artifacts/Dayset_x64.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Dayset ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Dayset_x64.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
